server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets — Flutter web's main.dart.js / canvaskit payloads
    # are large, and this is the single biggest lever for a smooth first
    # load over a VPS's uplink.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm font/woff2 image/svg+xml;

    # Security review finding: this file had no security headers at all —
    # anything could iframe the app (clickjacking), browsers would sniff
    # content types instead of trusting the server, and there was no
    # Content-Security-Policy limiting what a script running on the page
    # (e.g. from a supply-chain-compromised dependency) could reach or load.
    #
    # nginx gotcha worth flagging: `add_header` is only *inherited* by a
    # location block if that location has no `add_header` of its own — both
    # location blocks below already set their own Cache-Control, so these
    # are repeated in every location rather than set once at server level,
    # where the two Cache-Control location blocks would otherwise silently
    # drop them.
    #
    # The CSP's script/connect/frame allowances are specifically for the
    # Google Sign-In web flow (google_sign_in_web injects Google's Identity
    # Services script at runtime and can use an accounts.google.com iframe)
    # and for calling the Drive API directly from the browser — not
    # independently verified against a live deploy from this environment
    # (see README's "honestly noted" caveats elsewhere). If sign-in or Drive
    # import breaks only on the web build after deploying this, open the
    # browser console first — a blocked request shows up there as a CSP
    # violation naming the exact directive to loosen.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";

    # Flutter web assets are content-hashed on rebuild, so long-cache them...
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # ...but never cache index.html itself, or a redeploy won't be picked up
    # by anyone with the old version still cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri =404;
    }

    # Flutter web uses client-side routing; fall back to index.html for any
    # path that isn't a real static file so deep links don't 404.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy $csp always;
        try_files $uri $uri/ /index.html;
    }
}
