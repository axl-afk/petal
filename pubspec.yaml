name: petal
description: "Petal — a cross-platform music player for local files and pasted Google Drive / OneDrive links, with time-synced lyrics."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

# NOTE ON VERSIONS
# These versions were current at the time this project was authored (mid-2025).
# This project could not be built or `pub get`-resolved inside the sandbox that
# generated it (see README.md — the sandbox blocks pub.dev / storage.googleapis.com
# outbound access). On your own machine, run `flutter pub get` first; if any
# version fails to resolve, run `flutter pub upgrade --major-versions` and fix
# any resulting breaking-change warnings — package APIs may have moved on since.

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  # Database (structured storage + FTS5 full-text search)
  drift: ^2.20.1
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # Playback (local files + HTTP-streamed Drive/OneDrive direct links)
  just_audio: ^0.9.40
  just_audio_web: ^0.4.13
  audio_session: ^0.1.21

  # Local file import (desktop/mobile only — gated behind kIsWeb)
  file_picker: ^8.1.2
  # Reads embedded ID3/FLAC/MP4 tags (title/artist/album/genre/cover art) on
  # import. This project originally used `audiotags`, which turned out to
  # have a real, long-open, maintainer-unresponsive bug breaking every
  # macOS/iOS build (github.com/erikas-taroza/audiotags issues #14/#21/#34 —
  # a flutter_rust_bridge v1/v2 symbol mismatch between its bundled native
  # header and its compiled library, independent of CPU architecture, so
  # restricting the build to one architecture never could have fixed it).
  # Switched to audio_metadata_reader instead — pure Dart, no native/FFI
  # bridge at all, so this entire class of platform-linking failure isn't
  # possible with it. See local_file_service_io.dart's importFile().
  audio_metadata_reader: ^1.7.1

  # Auth
  google_sign_in: ^6.2.1
  flutter_web_auth_2: ^4.0.0   # generic OAuth2 browser round-trip, used for Microsoft sign-in
  crypto: ^3.0.5               # PKCE code_challenge generation for Microsoft OAuth

  # Networking
  http: ^1.2.2

  # Persistence for session / theme / small settings (not library data — that's in drift)
  shared_preferences: ^2.3.2

  uuid: ^4.5.1
  url_launcher: ^6.3.1

  # Desktop window chrome — sets a minimum window size (so the player can't
  # be resized/"folded" down to something unusably small) and lets the app
  # listen for native-fullscreen enter/exit on macOS (see
  # lib/data/services/window/window_service.dart). Desktop-only: the
  # package declares no Android/iOS/web platform implementation, so it's a
  # harmless Dart-level dependency everywhere else — every call to it is
  # additionally gated behind a defaultTargetPlatform check, never invoked
  # off Windows/macOS/Linux.
  window_manager: ^0.5.2

  # First-run "Petal would like access to your audio files" permission
  # prompt on Android (see ui/screens/onboarding_screen.dart). NOT needed
  # by file_picker itself — verified against file_picker's own manifest/
  # changelog that its Android (SAF-based) and iOS (system document-picker)
  # flows both work with zero runtime permission grants, so this exists
  # only for the explicit first-run "ask permission" moment the product
  # wants, and to have real request plumbing in place for a future
  # on-device MediaStore scan. Requires compileSdk 35+ (already at 36 —
  # see apply_packaging_snippets.py).
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

# Generates real per-platform app icons (Android adaptive icon, iOS, macOS,
# Windows, web favicon/manifest icons) from assets/icon/ — run
# `dart run flutter_launcher_icons` after `flutter pub get` and before your
# first release build of each platform. Source images were generated from
# the logo you provided (a rounded square, #F0F7FF background, orange music
# note) — icon_square.png is that artwork flattened onto its own background
# color for platforms that don't do adaptive masking (iOS/macOS/Windows/web);
# icon_foreground.png/icon_background.png split it into Android's adaptive
# icon layers, with the foreground scaled down so the note doesn't get
# clipped by the circular/squircle mask Android applies.
flutter_launcher_icons:
  image_path: "assets/icon/icon_square.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/icon_square.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_square.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/icon_square.png"
    background_color: "#F0F7FF"
    theme_color: "#F0F7FF"
